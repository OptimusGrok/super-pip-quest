// ---------------- touch controls ----------------
// Invisible floating stick on the left half (anchors where the thumb lands), right half = jump (hold for height),

let TC = null;

function setupTouch() {

  const inR = (r, x, y, pad) => r && r.width && x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
  const inPlay = () => App.scene && App.scene.kind === 'level' && !App.paused && App.touchMode;

    if (TC.fsTried) return; if (navigator.userActivation && !navigator.userActivation.isActive) return; TC.fsTried = true;
